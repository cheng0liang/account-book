<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F08300">
<meta name="color-scheme" content="light dark">
<title>Receipt Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<style>
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F6F4F0;z-index:999}
@media (prefers-color-scheme:dark){#boot{background:#15120f}}
#boot i{width:36px;height:36px;border-radius:50%;border:4px solid #F08300;border-top-color:transparent;animation:bootspin .8s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<div id="boot"><i></i></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
